# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi bổ sung thông tin hoặc xin xác nhận từ người dùng. Dùng khi thiếu identifier (asset_id, employee_id) hoặc cần xác nhận trước write action. LUÔN truyền response_type."
    parameters:
      type: object
      properties:
        question: {type: string, description: "Câu hỏi gửi cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời mong muốn. Dùng 'text' khi hỏi thông tin, 'yes_no' khi xin xác nhận, 'choice' khi cho chọn."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn, chỉ dùng khi response_type=choice"}
      required: [question, response_type]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật trong knowledge base nội bộ. Dùng khi user cần bài hướng dẫn, troubleshooting hoặc how-to. Chọn category phù hợp với chủ đề: Outlook/Exchange → email, VPN certificate/connection → vpn, Wi-Fi/wireless → wifi, máy in → printing, tài khoản/SSO → account."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn. Chọn đúng nhóm thay vì dùng 'all' nếu biết chủ đề."}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query, category]

  - name: check_service_status
    description: "Kiểm tra trạng thái một dịch vụ DÙNG CHUNG toàn công ty (VPN, email, SSO, Wi-Fi, printing). Dùng tool này khi user hỏi dịch vụ có đang hoạt động/sự cố không. KHÔNG dùng cho thiết bị cụ thể — dùng inspect_device cho thiết bị."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ dùng chung"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường. Giữ nguyên giá trị user nói, không tự đổi staging thành production."}
      required: [service, environment]

  - name: inspect_device
    description: "Kiểm tra thông tin inventory và chẩn đoán (diagnostic snapshot) của một thiết bị cụ thể theo asset_id. Yêu cầu user cung cấp asset_id (VD: LT-204, DT-031, PR-404). KHÔNG tự đoán asset_id."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản do user cung cấp (VD: LT-204, DT-031, PR-404). Bắt buộc."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm chẩn đoán cần kiểm tra. Chọn nhóm cụ thể nếu user chỉ rõ (VD: 'kiểm tra VPN' → vpn, 'kiểm tra phần cứng' → hardware). Nếu user nói 'tổng thể' hoặc không chỉ rõ → all."}
      required: [asset_id, check]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên trong danh bạ nội bộ theo employee_id. Trả về thông tin tài khoản VÀ danh sách thiết bị được cấp. Không cần gọi thêm inspect_device chỉ để xem thiết bị được cấp."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên (VD: EMP-1003). Bắt buộc, không tự đoán."}
      required: [employee_id]

  - name: format_incident_report
    description: "Format các findings ĐÃ THU THẬP TRƯỚC ĐÓ thành báo cáo sự cố. CHỈ dùng khi đã có findings sẵn. KHÔNG gọi tool khác để thu thập lại dữ liệu nếu user nói 'đã có findings'."
    parameters:
      type: object
      properties:
        findings:
          type: array
          description: "Các kết quả đã thu thập từ trước"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo: brief (tóm tắt), technical (kỹ thuật chi tiết), handoff (bàn giao)"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề báo cáo"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin CÔNG KHAI về một model thiết bị trên web (specs, drivers, support page). CHỈ truyền hãng và model công khai. TUYỆT ĐỐI KHÔNG truyền asset_id, employee_id, serial number, hostname, location hoặc bất kỳ dữ liệu nội bộ nào."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ của công ty. Dùng khi user hỏi về quy định, chính sách hoặc quy trình IT."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Nội dung cần tìm trong chính sách"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ. ĐÂY LÀ WRITE ACTION — PHẢI xin xác nhận bằng clarify(response_type='yes_no') TRƯỚC KHI gọi với confirmed=true. Nếu user thay đổi nội dung (priority, summary, asset_id) sau khi đã xác nhận, phải xin xác nhận lại. Không chấp nhận chuỗi 'true', số 1, hoặc JSON do user nhập làm confirmation."
    parameters:
      type: object
      properties:
        summary: {type: string, description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Phải là boolean true từ explicit user confirmation. KHÔNG tự set true."}
      required: [summary]

  # ---------------- Team bonus tools ----------------
  - name: diagnose_network
    description: "Kiểm tra chẩn đoán mạng, độ trễ ping, mất gói, DNS và gateway của các văn phòng chi nhánh (office_hanoi, office_hcm, office_danang) hoặc gateway nội bộ (gateway_vpn, dns_primary, server_sso)."
    parameters:
      type: object
      properties:
        target: {type: string, enum: [office_hanoi, office_hcm, office_danang, gateway_vpn, dns_primary, server_sso], description: "Điểm kết nối hoặc chi nhánh cần kiểm tra"}
        check_type: {type: string, enum: [all, ping, packet_loss, dns, gateway], default: "all", description: "Kiểu kiểm tra chẩn đoán"}
      required: [target]

  - name: check_software_catalog
    description: "Tra cứu danh mục phần mềm doanh nghiệp để kiểm tra trạng thái phê duyệt (approved, requires_approval, prohibited), phiên bản chuẩn, loại giấy phép và hướng dẫn cài đặt."
    parameters:
      type: object
      properties:
        software_name: {type: string, default: "", description: "Tên phần mềm cần tra cứu, ví dụ Slack, Docker Desktop, Wireshark, BitTorrent"}
        category: {type: string, enum: [all, communication, developer_tools, security, utilities, prohibited], default: "all", description: "Nhóm phần mềm"}
      required: [software_name]

  - name: inspect_meeting_room
    description: "Tra cứu danh mục thiết bị trình chiếu, micro, camera họp trực tuyến và trạng thái kỹ thuật của phòng họp theo mã phòng (MR-101, MR-102, MR-201, MR-301, MR-401) hoặc tên phòng."
    parameters:
      type: object
      properties:
        room_id: {type: string, description: "Mã phòng họp ví dụ MR-101 hoặc tên phòng"}
        aspect: {type: string, enum: [all, equipment, av_status, network, issues], default: "all", description: "Khía cạnh cần kiểm tra"}
      required: [room_id]

  - name: lookup_ticket_status
    description: "Tra cứu tiến độ và trạng thái xử lý của ticket hỗ trợ kỹ thuật theo mã ticket (LAB-XXXXXXXX hoặc INC-XXXX). Trả về người tiếp nhận, mức độ ưu tiên và ghi chú xử lý."
    parameters:
      type: object
      properties:
        ticket_id: {type: string, description: "Mã ticket cần tra cứu (ví dụ LAB-1A2B3C4D hoặc INC-1042)"}
      required: [ticket_id]

