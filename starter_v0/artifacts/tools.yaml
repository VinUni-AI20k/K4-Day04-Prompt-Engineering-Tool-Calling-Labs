# starter_v0 -> v3 tool declarations.
# Synchronized across tools/__init__.py and eval suites.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi câu hỏi làm rõ (text), xin xác nhận tạo/rà lại thông tin ticket (yes_no), hoặc chọn môi trường (choice). Dùng response_type='yes_no' khi cần xác nhận tạo ticket hoặc khi người dùng yêu cầu rà lại payload/kiểm tra lại thông tin ticket."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cần hỏi người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Dùng 'text' khi thiếu mã asset/employee; 'yes_no' khi cần xác nhận tạo hoặc rà lại thông tin ticket; 'choice' khi cần chọn phương án môi trường"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn khi response_type là choice, ví dụ ['production', 'staging']"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật, tài liệu cấu hình phần mềm/email (ví dụ hướng dẫn cấu hình Outlook)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn, ví dụ 'email' cho Outlook"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái của một dịch vụ dùng chung (VPN, email, SSO, Wi-Fi, printing)."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    description: "Chẩn đoán kỹ thuật phần cứng, mạng, bảo mật của thiết bị cụ thể theo mã asset (KHÔNG dùng để kiểm tra thông tin ticket hay rà soát payload)."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản, ví dụ LT-204, DT-087"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin tài khoản người dùng hoặc nhân viên trong danh bạ hỗ trợ."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên, ví dụ EMP-1003"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo sự cố theo mẫu."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề sự cố"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong tài liệu chính sách IT nội bộ của công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung chính sách cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo ticket hỗ trợ mới trên hệ thống. Chỉ gọi khi người dùng đã xác nhận đồng ý (sau bước clarify yes_no)."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
