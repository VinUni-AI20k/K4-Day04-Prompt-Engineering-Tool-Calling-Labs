# starter_v0 — Optimized tool declarations for v2.
# Synchronized with tools/__init__.py and eval datasets.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "BẮT BUỘC gọi khi cần hỏi thêm thông tin bị thiếu (như asset_id, employee_id với response_type='text'), làm rõ lựa chọn (response_type='choice' cùng danh sách options), hoặc XIN XÁC NHẬN từ người dùng trước khi tạo ticket / thực hiện hành động ghi (response_type='yes_no'). Tuyệt đối không gửi câu hỏi làm rõ hay câu hỏi xác nhận dưới dạng văn bản thường."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi hoặc thông tin chi tiết cần người dùng xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi: 'text' khi cần điền chuỗi, 'yes_no' khi cần người dùng xác nhận hành động, 'choice' khi cần chọn từ danh sách"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách các lựa chọn hợp lệ khi response_type là 'choice'"}
      required: [question]

  - name: search_kb
    description: "Tìm kiếm bài viết hướng dẫn khắc phục sự cố kỹ thuật trong knowledge base nội bộ. Luôn chỉ định category phù hợp (vpn, email, wifi, printing, account, security, hardware, software, meeting_room) khi chủ đề đã rõ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cần tra cứu"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Chuyên mục hướng dẫn tương ứng"}
        top_k: {type: integer, default: 3, description: "Số lượng bài viết cần lấy"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái hoạt động của một dịch vụ dùng chung (vpn, email, sso, wifi, printing). Khi cần so sánh hoặc kiểm tra cả hai môi trường production và staging, hãy GỌI TOOL NÀY NHIỀU LẦN SONG SONG (một lần cho production, một lần cho staging)."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ dùng chung"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường triển khai: 'production' hoặc 'staging'"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra cấu hình và chẩn đoán phần cứng/mạng/bảo mật của một thiết bị cụ thể theo mã asset_id. Khi biết rõ loại sự cố, hãy chọn check cụ thể (network, vpn, security, hardware, software) thay vì 'all'. Nếu người dùng yêu cầu kiểm tra nhiều máy (ví dụ 2 laptops), hãy GỌI TOOL NÀY NHIỀU LẦN SONG SONG cho từng asset_id."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản định danh thiết bị (ví dụ: LT-204, DT-087)"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Hạng mục chẩn đoán cụ thể"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên, phòng ban và danh sách thiết bị được cấp theo mã nhân viên employee_id."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên (ví dụ: EMP-1001)"}
      required: [employee_id]

  - name: format_incident_report
    description: "Định dạng các phát hiện/kết quả đã có thành báo cáo sự cố (brief, technical, handoff). Dùng khi người dùng yêu cầu lập báo cáo từ các findings đã thu thập sẵn; không thực hiện lại các tool chẩn đoán khác."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Danh sách các phát hiện kỹ thuật đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu định dạng báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề của báo cáo sự cố"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web (specs, drivers, support, compatibility). Chỉ truyền tên hãng và tên model công khai; tuyệt đối không truyền asset_id, employee_id hay dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo, Dell, HP"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả cần tìm"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tra cứu các quy định và chính sách IT nội bộ của công ty theo lĩnh vực (access_control, data_privacy, external_tools, incident_response, service_operations, ticketing)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chính sách cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Lĩnh vực chính sách"}
        top_k: {type: integer, default: 3, description: "Số lượng điều khoản cần lấy"}
      required: [query]

  - name: create_ticket
    description: "Tạo ticket hỗ trợ mới trên hệ thống IT Service Desk. CHỈ ĐƯỢC GỌI sau khi người dùng đã xác nhận rõ ràng qua bước clarify(response_type='yes_no')."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản liên quan nếu có"}
        confirmed: {type: boolean, default: false, description: "Trạng thái đã được người dùng xác nhận"}
      required: [summary]
