# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái một dịch vụ."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin và chẩn đoán thiết bị."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu người dùng trong danh bạ hỗ trợ."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]

  # ---------------- Bonus tool ----------------
  - name: diagnose_network
    description: >-
      Thực hiện chẩn đoán chuyên sâu mạng viễn thông (đo ping latency, packet loss, jitter, và phân giải tên miền DNS) tới một target cụ thể (hostname, địa chỉ IP, hoặc dịch vụ nội bộ như 'vpn.northstar.internal', 'gateway', 'dns.northstar.internal', 'mail.northstar.internal', 'sso.northstar.internal', '8.8.8.8', 'google.com').
      Có thể kết hợp với 'asset_id' để chẩn đoán theo góc nhìn và vị trí vật lý của thiết bị cụ thể (ví dụ: mất gói tin gateway trên DT-087, mất kết nối Wi-Fi tầng 4 trên LT-240).
      PHÂN BIỆT RÕ RÀNG:
      (1) Dùng diagnose_network khi cần kiểm tra kết nối chi tiết (ping/DNS/latency/packet loss) tới một endpoint hoặc nghi ngờ đường truyền mạng.
      (2) KHÔNG dùng tool này để kiểm tra trạng thái hoạt động dịch vụ chung toàn công ty (dùng check_service_status).
      (3) KHÔNG dùng tool này để kiểm tra phần cứng/phần mềm tổng thể của máy tính (dùng inspect_device).
      RANH GIỚI AN TOÀN BẮT BUỘC:
      - CẤM truyền ký tự metacharacters hoặc lệnh shell vào target.
      - CẤM quét các địa chỉ loopback (localhost, 127.0.0.1) và cloud metadata (169.254.169.254).
      - CẤM đưa mật khẩu, token, API key vào target.
    parameters:
      type: object
      properties:
        target:
          type: string
          description: "Tên miền (hostname), địa chỉ IP, hoặc endpoint nội bộ cần chẩn đoán (ví dụ: 'vpn.northstar.internal', 'dns.northstar.internal', 'gateway', 'mail.northstar.internal', '8.8.8.8'). Không chứa ký tự đặc biệt hoặc lệnh shell."
        check_type:
          type: string
          enum: [all, ping, dns]
          default: "all"
          description: "Phạm vi chẩn đoán: 'all' (kiểm tra cả ping và DNS), 'ping' (chỉ đo độ trễ và mất gói tin ping), hoặc 'dns' (chỉ phân giải DNS và trạng thái resolver)."
        asset_id:
          type: string
          default: ""
          description: "Mã định danh tài sản của thiết bị gửi yêu cầu (ví dụ: 'LT-204', 'DT-087', 'LT-240') nếu muốn chẩn đoán từ góc nhìn giao diện mạng và vị trí của thiết bị đó."
        packet_count:
          type: integer
          default: 4
          description: "Số lượng gói tin ping thử nghiệm (từ 1 đến 10). Mặc định là 4."
      required: [target]

