# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm bài hướng dẫn khắc phục sự cố trong knowledge base nội bộ (how-to, troubleshooting). KHÔNG dùng để tra chính sách công ty; chính sách thuộc tool policy."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category:
          type: string
          enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room]
          default: "all"
          description: >-
            Phân nhóm theo DỊCH VỤ mà bài hướng dẫn nói tới, không theo từ ngữ
            trong câu hỏi. 'vpn': kết nối VPN, certificate VPN. 'email': Outlook,
            mail profile, mailbox, cấu hình hộp thư. 'wifi': Wi-Fi, kết nối không
            dây. 'printing': máy in, print spooler. 'account': SSO, đăng nhập,
            khóa/mở khóa tài khoản, MFA. 'security': mã hóa ổ đĩa, bảo mật thiết
            bị. 'hardware': ổ cứng, pin, linh kiện. 'software': ứng dụng, driver.
            'meeting_room': thiết bị phòng họp, âm thanh. Lưu ý 'profile' của
            Outlook thuộc 'email', không phải 'account'. Chỉ dùng 'all' khi câu
            hỏi không thuộc nhóm nào ở trên.
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái vận hành trực tuyến của các dịch vụ hạ tầng công nghệ thông tin dùng chung toàn công ty (VPN, Email, SSO, Wi-Fi, Printing). KHÔNG dùng để kiểm tra máy tính hay thiết bị cá nhân của người dùng."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment:
          type: string
          enum: [production, staging]
          default: "production"
          description: >-
            Môi trường triển khai. Hệ thống chỉ có đúng hai môi trường:
            'production' và 'staging'. Chọn giá trị khi người dùng gọi đúng tên
            một trong hai, hoặc khi ngữ cảnh hội thoại đã xác định môi trường đó.
            Mặc định 'production' khi người dùng không nhắc tới môi trường nào.
            Các tên khác như demo, test, dev, QA, UAT, sandbox hay staging của
            một team riêng KHÔNG tương ứng với môi trường nào ở đây: không tự ánh
            xạ chúng sang 'staging' hay 'production', mà hỏi lại bằng tool
            clarify với response_type 'choice' và options là hai giá trị hợp lệ.
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin chi tiết và dữ liệu chẩn đoán snapshot của MỘT thiết bị cụ thể theo mã tài sản. Mã tài sản gồm tiền tố LT, DT, MB, PR hoặc RM kèm dấu gạch nối và các chữ số, ví dụ LT-204. Chỉ nhận mã tài sản, KHÔNG nhận mã nhân viên. KHÔNG dùng cho dịch vụ dùng chung toàn hệ thống."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản thiết bị có thật do người dùng cung cấp, ví dụ LT-204 hoặc DT-087. Không nhận mã nhân viên. Nếu người dùng chưa nêu mã cụ thể, KHÔNG tự tạo giá trị và KHÔNG điền chuỗi mẫu; hãy hỏi lại bằng tool clarify."}
        check:
          type: string
          enum: [all, network, vpn, security, hardware, software]
          default: "all"
          description: "Hạng mục chẩn đoán cần kiểm tra: 'all', 'network', 'vpn', 'security', 'hardware', 'software'. BẮT BUỘC chọn đúng nhóm tương ứng khi người dùng nêu triệu chứng cụ thể (ví dụ: sự cố VPN thì phải chọn 'vpn'). Giá trị 'all' CHỈ DÙNG khi người dùng không nêu triệu chứng nào hoặc yêu cầu kiểm tra tổng thể."
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu hồ sơ tài khoản nhân viên và danh sách thiết bị được cấp phát (assigned_assets) trong danh bạ nội bộ theo mã nhân viên. Mã nhân viên gồm tiền tố EMP kèm dấu gạch nối và các chữ số, ví dụ EMP-1003. Tool này ĐÃ BAO GỒM danh sách thiết bị được cấp, KHÔNG CẦN gọi thêm inspect_device nếu người dùng chỉ muốn biết nhân viên được cấp những thiết bị nào."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã định danh nhân viên có thật do người dùng cung cấp, ví dụ EMP-1003. Tên riêng, tên phòng ban hay chức danh KHÔNG phải mã nhân viên. Nếu người dùng chưa nêu mã cụ thể, KHÔNG tự tạo giá trị và KHÔNG điền chuỗi mẫu; hãy hỏi lại bằng tool clarify."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tra quy định trong chính sách IT nội bộ của công ty (được phép hay không được phép làm gì). KHÔNG dùng để tìm hướng dẫn khắc phục sự cố; hướng dẫn thuộc tool search_kb."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area:
          type: string
          enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing]
          default: "all"
          description: >-
            Mỗi giá trị tương ứng một văn bản chính sách. 'access_control': xác
            minh danh tính, reset mật khẩu, mở khóa tài khoản, quy định về việc
            hỏi MFA/recovery code. 'data_privacy': dữ liệu nào bị cấm đưa vào
            ticket, log, transcript hay screenshot (password, token, MFA, thông
            tin cá nhân). 'external_tools': dữ liệu nào được phép gửi ra
            web-search bên ngoài. 'incident_response': cách phân loại mức độ và
            ánh xạ priority (critical/high/medium/low), quy tắc escalation.
            'service_operations': vận hành dịch vụ dùng chung, status check,
            thay đổi cấu hình dịch vụ, quy định về environment.
            'ticketing': ranh giới xác nhận trước khi tạo ticket, chất lượng nội
            dung ticket. BẮT BUỘC chọn đúng nhóm khi câu hỏi thuộc một trong các
            chủ đề trên; chỉ dùng 'all' khi câu hỏi không rơi vào nhóm nào.
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
