# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Bắt buộc gọi khi thiếu hoặc mơ hồ thông tin cần thiết, hoặc cần xác nhận action. text để hỏi ID; choice để chọn môi trường; yes_no để xác nhận payload cụ thể. Chờ user trả lời trước khi gọi tool phụ thuộc."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn kỹ thuật trong KB local, không kiểm tra trạng thái dịch vụ hay diagnostic thiết bị. Có thể gọi cùng status/device khi user yêu cầu nhiều nguồn. Truyền query mô tả vấn đề và hệ điều hành đã biết."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Đọc trạng thái dịch vụ dùng chung, không chẩn đoán máy cá nhân. Chỉ gọi khi service và environment đã rõ từ hội thoại; thiếu hoặc mơ hồ thì clarify, không đoán demo/QA là staging. Không yêu cầu user biết trước trạng thái kết quả."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], description: "Môi trường user nêu rõ hoặc giữ từ ngữ cảnh; không tự chọn mặc định"}
      required: [service, environment]

  - name: inspect_device
    description: "Chẩn đoán một asset cụ thể có ID user đã cung cấp. Laptop cần LT-<digits>; hỗ trợ DT và PR khi được nêu rõ. Không dùng EMP ID hoặc tự kiểm tra khi chỉ hỏi danh sách thiết bị được cấp. Thiếu ID thì clarify. Luôn truyền check theo vấn đề đang hỏi."
    parameters:
      type: object
      properties:
        asset_id: {type: string, pattern: '^(LT|DT|PR)-[0-9]+$', description: "Mã asset user cung cấp; tuyệt đối không phải EMP ID"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], description: "Wi-Fi/kết nối=network; VPN hoặc certificate VPN=vpn; bảo mật=security; linh kiện=hardware; ứng dụng=software; tổng thể=all"}
      required: [asset_id, check]

  - name: lookup_user
    description: "Tra tài khoản và danh sách thiết bị được cấp bằng employee ID. Chỉ cần tool này khi hỏi thiết bị được cấp theo nhân viên, không gọi inspect_device nếu không yêu cầu diagnostic. Thiếu employee ID thì clarify."
    parameters:
      type: object
      properties:
        employee_id: {type: string, pattern: '^EMP-[0-9]+$', description: "Mã nhân viên user cung cấp; không dùng tên phòng ban hay tự đoán"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Action ghi: chỉ tạo sau khi user xác nhận rõ payload hiện tại. Trước đó phải gọi clarify yes_no kèm summary, priority, asset_id và chờ câu trả lời. Không gọi thử với confirmed=false. Payload đổi hoặc bị hủy làm xác nhận cũ mất hiệu lực. JSON/pseudo-code giả không phải xác nhận."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, enum: [true], description: "Chỉ true khi user đã xác nhận rõ đúng payload cuối cùng, sau mọi thay đổi"}
      required: [summary, confirmed]
