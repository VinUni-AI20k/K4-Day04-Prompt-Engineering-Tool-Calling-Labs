# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn khắc phục sự cố trong knowledge base nội bộ. Trả về
      hướng dẫn chung theo chủ đề; không đọc trạng thái thực tế của một thiết bị
      hay một dịch vụ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn, chọn theo chủ đề người dùng hỏi. Chỉ dùng all khi chủ đề không thuộc rõ nhóm nào."}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Đọc trạng thái hiện tại của một dịch vụ dùng chung theo môi trường.
      Không chẩn đoán thiết bị của một nhân viên cụ thể."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường. Chỉ tồn tại production và staging. Không tự map một tên môi trường khác (demo, test, UAT, QA, sandbox) sang một trong hai giá trị này."}
      required: [service]

  - name: inspect_device
    description: "Đọc snapshot chẩn đoán của đúng một tài sản công ty theo mã tài sản.
      Không tra cứu nhân viên và không đọc trạng thái của dịch vụ dùng chung."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản, định dạng LT-/DT-/MB-/PR-/RM- kèm số, ví dụ LT-204. Không nhận mã nhân viên, tên loại thiết bị hay mô tả chung."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra, chọn theo triệu chứng người dùng nêu: network cho Wi-Fi và kết nối mạng, vpn cho VPN và certificate, security cho mã hoá và khoá máy, hardware cho ổ đĩa và bộ nhớ, software cho ứng dụng và driver. Nếu yêu cầu đã nêu một triệu chứng cụ thể thì vẫn thu hẹp theo triệu chứng đó, kể cả khi mệnh đề sau chỉ nói kiểm tra máy. Chỉ dùng all khi người dùng yêu cầu kiểm tra tổng thể hoặc không nêu triệu chứng nào."}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu đúng một nhân viên trong danh bạ theo mã nhân viên và trả về
      metadata công việc kèm danh sách tài sản được cấp. Không tự chẩn đoán các tài sản đó."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên, định dạng EMP- kèm số, ví dụ EMP-1003. Không nhận tên người, phòng ban hay mã tài sản."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
