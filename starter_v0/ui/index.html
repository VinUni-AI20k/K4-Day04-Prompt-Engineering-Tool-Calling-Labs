<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northstar IT Helpdesk</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">NORTHSTAR LABS · INTERNAL</p>
        <h1>IT Helpdesk Agent</h1>
      </div>
      <div id="artifact" class="artifact">Loading artifact…</div>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <article class="message assistant">
        <span class="label">Agent</span>
        <p>Chào bạn. Hãy mô tả yêu cầu IT; mọi tool call và kết quả sẽ xuất hiện trong trace.</p>
      </article>
    </section>

    <form id="chat-form" class="composer">
      <label for="message">Yêu cầu</label>
      <div class="compose-row">
        <textarea id="message" rows="2" maxlength="10000" placeholder="Ví dụ: Kiểm tra VPN production và hardware của LT-204" required></textarea>
        <button type="submit">Gửi</button>
      </div>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
